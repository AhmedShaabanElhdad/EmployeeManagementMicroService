spring.application.name=employee-service
server.port=9000
eureka.client.service-url.defaultZone=http://eureka-server:8761/eureka/
spring.docker.compose.enabled=false

# R2DBC Database Configuration (Reactive)
spring.r2dbc.url=r2dbc:postgresql://postgres-employee:5432/employees
spring.r2dbc.username=admin
spring.r2dbc.password=admin123

# JDBC Database Configuration (Required for Flyway)
spring.datasource.url=jdbc:postgresql://postgres-employee:5432/employees
spring.datasource.username=admin
spring.datasource.password=admin123
spring.datasource.driver-class-name=org.postgresql.Driver

# Flyway
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true

############ Redis Caching (Reactive) ############
spring.cache.type=redis
spring.data.redis.host=redis
spring.data.redis.port=6379
spring.cache.redis.time-to-live=600000

############ RabbitMq ############
spring.rabbitmq.host=rabbitmq
spring.rabbitmq.port=5672
spring.rabbitmq.username=myuser
spring.rabbitmq.password=secret

############ Kafka ############
spring.kafka.bootstrap-servers=kafka:29092
spring.kafka.consumer.group-id=employee-group
spring.kafka.consumer.auto-offset-reset=earliest

############ S3 / MinIO ############
aws.s3.endpoint=http://minio:9000
aws.s3.access-key=minioadmin
aws.s3.secret-key=minioadmin
aws.s3.bucket=employee-images

############ Secrets (Synced) ############
jwt.secret=VGhpc0lzQVN1cGVyU2VjdXJlSldUU2VjcmV0S2V5Rm9ySFM1MTI=
internal.api.secret=your-internal-api-secret-key-change-me-in-production

############ Tracing ############
management.tracing.sampling.probability=1.0
management.zipkin.tracing.endpoint=http://zipkin:9411/api/v2/spans

############ Monitoring ############
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.show-details=always
management.metrics.export.prometheus.enabled=true
