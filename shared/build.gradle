plugins {
    id 'java-library'
    id 'io.spring.dependency-management'
    id 'com.google.protobuf' version '0.9.4'
}

group = 'com.example'
version = '0.0.1-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

repositories {
    mavenCentral()
}

dependencyManagement {
    imports {
        mavenBom "org.springframework.boot:spring-boot-dependencies:3.3.5"
        mavenBom "org.springframework.cloud:spring-cloud-dependencies:2023.0.3"
    }
}

dependencies {
    // Strictly compileOnly as per requirement - each service must provide these
    compileOnly 'jakarta.validation:jakarta.validation-api'
    compileOnly 'jakarta.annotation:jakarta.annotation-api:2.1.1'
    compileOnly 'javax.annotation:javax.annotation-api:1.3.2'
    compileOnly 'org.slf4j:slf4j-api'
    compileOnly 'io.micrometer:micrometer-core'
    compileOnly 'org.springframework:spring-context'
    compileOnly 'org.springframework.boot:spring-boot-autoconfigure'
    
    // Jackson annotations for JSON serialization control
    compileOnly 'com.fasterxml.jackson.core:jackson-annotations'

    // gRPC - compileOnly for consumers
    compileOnly 'io.grpc:grpc-stub:1.62.2'
    compileOnly 'io.grpc:grpc-protobuf:1.62.2'
    
    // Internal to shared for code generation and stubs
    implementation 'io.grpc:grpc-netty-shaded:1.62.2'

    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'
}

protobuf {
    protoc {
        artifact = "com.google.protobuf:protoc:3.25.3"
    }
    plugins {
        grpc {
            artifact = "io.grpc:protoc-gen-grpc-java:1.62.2"
        }
    }
    generateProtoTasks {
        all()*.plugins {
            grpc {}
        }
    }
}
