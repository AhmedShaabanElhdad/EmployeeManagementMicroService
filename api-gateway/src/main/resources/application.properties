spring.application.name=api-gateway
server.port=8080
spring.main.web-application-type=reactive
eureka.client.service-url.defaultZone=http://eureka-server:8761/eureka
spring.cloud.gateway.server.webflux.discovery.locator.enabled=false
spring.main.allow-bean-definition-overriding=true
spring.docker.compose.enabled=false

# Vault Configuration
spring.cloud.vault.uri=http://localhost:8200
spring.cloud.vault.token=root
spring.cloud.vault.kv.enabled=true
spring.config.import=optional:vault://

# Disable gRPC auto-configuration to resolve conflicts with shared module dependencies
spring.cloud.gateway.grpc.enabled=false

################### Resilience4j
resilience4j.circuitbreaker.instances.employeeServiceCircuitBreaker.registerHealthIndicator=true
resilience4j.circuitbreaker.instances.employeeServiceCircuitBreaker.slidingWindowSize=10
resilience4j.circuitbreaker.instances.employeeServiceCircuitBreaker.failureRateThreshold=50
resilience4j.circuitbreaker.instances.employeeServiceCircuitBreaker.waitDurationInOpenState=10s
resilience4j.circuitbreaker.instances.employeeServiceCircuitBreaker.permittedNumberOfCallsInHalfOpenState=3
################### Rate Limit
spring.data.redis.host=redis
spring.data.redis.port=6379

################### Health & Monitoring
management.endpoints.web.exposure.include=health,info,prometheus,metrics
management.endpoint.health.show-details=always
management.metrics.export.prometheus.enabled=true

################### TimeOut
spring.cloud.gateway.httpclient.connect-timeout=5000
spring.cloud.gateway.httpclient.response-timeout=5s
################### Observability & Logging
logging.level.org.springframework.cloud.gateway=INFO
logging.level.reactor.netty=INFO
################### Tracing
management.tracing.sampling.probability=1.0
management.zipkin.tracing.endpoint=http://zipkin:9411/api/v2/spans

