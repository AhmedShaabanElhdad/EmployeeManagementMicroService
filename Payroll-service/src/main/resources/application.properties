spring.application.name=payroll-service
server.port=8084
eureka.client.serviceurl.defaultzone=http://eureka-server:8761/eureka/
spring.docker.compose.enabled=false
# Database - Mapped to 5435 in compose.yaml
spring.datasource.url=jdbc:postgresql://postgres-payroll:5435/payroll
spring.datasource.username=admin
spring.datasource.password=admin123
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.flyway.enabled=true
# Kafka - Restored Serializers for JSON support
spring.kafka.bootstrap-servers=kafka:29092
spring.kafka.consumer.group-id=payroll-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=*
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
