spring.application.name=auth-service
server.port=8081
eureka.client.service-url.defaultZone=http://eureka-server:8761/eureka
spring.main.allow-bean-definition-overriding=true
spring.docker.compose.enabled=false

# Vault Configuration
spring.cloud.vault.uri=http://localhost:8200
spring.cloud.vault.token=root
spring.cloud.vault.kv.enabled=true
spring.config.import=optional:vault://

# Database - Mapped to 5436
spring.datasource.url=jdbc:postgresql://postgres-auth:5432/user
spring.datasource.username=admin
spring.datasource.password=admin123
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.flyway.enabled=true

############ Redis Caching ############
spring.cache.type=redis
spring.data.redis.host=redis
spring.data.redis.port=6379
# Cache TTL - 5 minutes for auth responses
spring.cache.redis.time-to-live=300000

############ Secrets (To be moved to Vault) ############
# These can be removed once added to Vault at secret/auth-service
# jwt.secret=${vault.jwt.secret}
# internal.api.secret=${vault.internal.api.secret}
jwt.secret=VGhpc0lzQVN1cGVyU2VjdXJlSldUU2VjcmV0S2V5Rm9ySFM1MTI=
internal.api.secret=VGhpc0lzQVN1cGVyU2sadasdldUU2VjcmV0S2V5Rm9ySFM1MTI=

############ Monitoring ############
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.show-details=always
management.metrics.export.prometheus.enabled=true
